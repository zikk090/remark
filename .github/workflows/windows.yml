name: Windows

on:
  push:
    paths:
      - "windows/**"
      - ".github/workflows/windows.yml"
  pull_request:
    paths:
      - "windows/**"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Work out version
        id: v
        shell: pwsh
        run: |
          $v = ([xml](Get-Content windows/Remark/Remark.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ("${{ github.event_name }}" -eq "release") { $v = "${{ github.event.release.tag_name }}".TrimStart("v") }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Publish (x64, self-contained, single file)
        run: >
          dotnet publish windows/Remark/Remark.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ steps.v.outputs.version }} -o publish/win-x64

      - name: End-to-end test (drives the real app on the runner's desktop)
        if: github.event_name != 'release'
        shell: pwsh
        run: windows/tests/e2e.ps1 -Exe publish/win-x64/Remark.exe -OutDir test-out -Fixture windows/tests/fixtures/mac-session

      - name: Publish test screenshots to the ci-artifacts branch
        if: always() && github.event_name != 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (-not (Test-Path test-out)) { exit 0 }
          $tmp = Join-Path $env:RUNNER_TEMP 'ci-artifacts'
          New-Item -ItemType Directory -Force $tmp | Out-Null
          Copy-Item test-out\* $tmp -Recurse
          Set-Content (Join-Path $tmp 'COMMIT.txt') "$env:GITHUB_SHA $env:GITHUB_RUN_ID"
          Set-Location $tmp
          git init -q -b ci-artifacts
          git config user.name 'github-actions'
          git config user.email 'github-actions@users.noreply.github.com'
          git add -A
          git commit -q -m "E2E results for $env:GITHUB_SHA"
          git push -q -f "https://x-access-token:$env:GH_TOKEN@github.com/$env:GITHUB_REPOSITORY.git" ci-artifacts

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.v.outputs.version }}" "/DSourceDir=$PWD\publish\win-x64" "/DOutputDir=$PWD\dist" windows\installer\Remark.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path publish\win-x64\* -DestinationPath "dist\Remark-${{ steps.v.outputs.version }}-win-x64-portable.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Remark-Windows-${{ steps.v.outputs.version }}
          path: dist/*

      - name: Attach to GitHub release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release upload "${{ github.event.release.tag_name }}" (Get-ChildItem dist/*).FullName --clobber
