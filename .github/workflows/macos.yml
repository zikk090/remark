name: macOS

on:
  push:
    paths-ignore:
      - "windows/**"
      - ".github/workflows/windows.yml"
  pull_request:
    paths-ignore:
      - "windows/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build DMG (ad-hoc signed)
        run: ./build.sh dmg
      - uses: actions/upload-artifact@v4
        with:
          name: Remark-macOS-dmg
          path: build/*.dmg
